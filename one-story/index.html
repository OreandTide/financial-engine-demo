<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ore &amp; Tide — One Journey, Five Screens</title>
<style>
  :root {
    --navy: #0B2D4F; --coastal: #2A6F8F; --mist: #E8F1F5; --sand: #F3E9D7;
    --gold: #D4A857; --ink: #10222e; --ok: #2E7D5B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--navy); color: var(--mist);
    font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 16px 40px; }
  h1 { font-family: Lora, Georgia, serif; font-weight: 600; font-size: 30px;
    margin: 4px 0 6px; color: var(--sand); }
  .sub { max-width: 760px; line-height: 1.5; font-size: 14.5px; color: #c6d8e2; margin: 0 0 16px; }
  .sub b { color: var(--sand); }
  .levers { display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    background: #0e3358; border: 1px solid #1d4a73; border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; }
  .levers .lab { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #9fc0d4; margin-right: 2px; }
  .levers button { background: #143d63; color: var(--mist); border: 1px solid #2A6F8F;
    border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; }
  .levers button.on { background: var(--gold); border-color: var(--gold); color: #23190a; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .screen { background: var(--mist); color: var(--ink); border-radius: 18px; padding: 16px 16px 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .screen h2 { font-family: Lora, Georgia, serif; font-size: 19px; margin: 0 0 2px; color: var(--navy); }
  .screen .tab { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--coastal); margin-bottom: 10px; }
  .dest { background: var(--navy); color: var(--mist); border-radius: 12px; padding: 11px 12px; font-size: 13.5px; line-height: 1.45; }
  .dest b { color: var(--gold); }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #b9cdd9; font-size: 13.5px; }
  .row:last-child { border-bottom: none; }
  .row .r { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note { font-size: 12px; color: #47606f; line-height: 1.45; margin-top: 8px; }
  .bubble { padding: 8px 0; border-bottom: 1px dashed #b9cdd9; font-size: 13.5px; line-height: 1.45; }
  .bubble:last-child { border-bottom: none; }
  .bubble b { color: var(--navy); }
  .big { font-family: Lora, Georgia, serif; font-size: 26px; color: var(--navy); }
  .foot { margin-top: 20px; font-size: 12.5px; color: #9fc0d4; line-height: 1.55; max-width: 760px; }
</style>
  <script type="module" crossorigin src="./assets/one-story-CtUHqp-7.js"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
