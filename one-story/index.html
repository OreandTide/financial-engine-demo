<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ore &amp; Tide — The App, One Story</title>
<style>
  :root {
    --navy: #0B2D4F; --coastal: #2A6F8F; --mist: #E8F1F5; --sand: #F3E9D7;
    --gold: #D4A857; --ink: #10222e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--navy); color: var(--mist);
    font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 20px 14px 34px; }
  h1 { font-family: Lora, Georgia, serif; font-weight: 600; font-size: 27px;
    margin: 2px 0 6px; color: var(--sand); text-align: center; }
  .sub { line-height: 1.5; font-size: 13.5px; color: #c6d8e2; margin: 0 auto 14px; max-width: 400px; text-align: center; }
  .sub b { color: var(--sand); }
  .levers { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    margin-bottom: 14px; }
  .levers .lab { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #9fc0d4; width: 100%; text-align: center; }
  .levers button { background: #143d63; color: var(--mist); border: 1px solid #2A6F8F;
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  .levers button.on { background: var(--gold); border-color: var(--gold); color: #23190a; font-weight: 600; }

  /* ---- the phone ---- */
  .phone { background: #0a0f14; border-radius: 44px; padding: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .device { background: var(--mist); color: var(--ink); border-radius: 36px; overflow: hidden;
    display: flex; flex-direction: column; height: min(780px, 88dvh); }
  .apphead { background: var(--navy); color: var(--mist); padding: 14px 18px 10px; }
  .apphead .brand { font-family: Lora, Georgia, serif; font-size: 17px; color: var(--sand); }
  .apphead .screen-name { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9fc0d4; margin-top: 2px; }
  .screenbody { flex: 1; overflow-y: auto; padding: 16px; position: relative; }
  .screenbody.mapbody { padding: 0; overflow: hidden; display: flex; }
  .screenbody.mapbody > div { flex: 1; }
  .phone .grm-frame.grm-frame { height: 100%; min-height: 0; border-radius: 0; }

  .bottomnav { display: flex; background: #fff; border-top: 1px solid #d5e2ea; }
  .bottomnav button { flex: 1; background: none; border: none; padding: 9px 0 11px; cursor: pointer;
    font-size: 10.5px; color: #5b7686; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bottomnav button .ic { font-size: 19px; line-height: 1; }
  .bottomnav button.on { color: var(--navy); font-weight: 700; box-shadow: inset 0 2px 0 var(--navy); }

  /* ---- app screens ---- */
  .card { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(11,45,79,.08); }
  .card h3 { font-family: Lora, Georgia, serif; font-size: 16px; margin: 0 0 6px; color: var(--navy); }
  .dest { background: var(--navy); color: var(--mist); border-radius: 12px; padding: 11px 12px; font-size: 13.5px; line-height: 1.45; }
  .dest b { color: var(--gold); }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #cfdde6; font-size: 13.5px; }
  .row:last-child { border-bottom: none; }
  .row .r { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note { font-size: 12px; color: #47606f; line-height: 1.45; margin-top: 8px; }
  .bubble { padding: 8px 0; border-bottom: 1px dashed #cfdde6; font-size: 13.5px; line-height: 1.45; }
  .bubble:last-child { border-bottom: none; }
  .bubble b { color: var(--navy); }
  .big { font-family: Lora, Georgia, serif; font-size: 32px; color: var(--navy); }
  .bar { height: 6px; background: #dbe7ee; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #b8893a, var(--gold)); }
  .foot { margin-top: 16px; font-size: 12.5px; color: #9fc0d4; line-height: 1.55; text-align: center; }
</style>
  <script type="module" crossorigin src="./assets/one-story-CX343pEz.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/one-story-DAI4CCtx.css">
</head>
<body>
<div id="root"></div>
</body>
</html>
