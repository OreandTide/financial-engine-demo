.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 14px;position:relative;z-index:1}
.brand .mark{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#fff;padding:2px}
.brand .bname{font-family:Georgia,serif;font-size:17px;line-height:1.15;color:#fff}
.brand .bsub{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#C8A878}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;position:relative;z-index:1}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#C9D6DF;text-align:left;padding:9px 10px;border-radius:9px;font-size:14.5px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--gold);color:#0A1F33;font-weight:600}
.nav .ico{width:18px;text-align:center;opacity:.9}
.side .foot{margin-top:auto;font-size:11.5px;color:#A9BFCE;line-height:1.5;padding:8px 6px 26px;position:relative;z-index:1}
.side .foot button{background:none;border:1px solid #3A4C5B;color:#C9D6DF;border-radius:8px;padding:5px 10px;font-size:12px;margin-top:6px}
/* ---------- main ---------- */
.main{flex:1;padding:26px 30px 60px;max-width:1180px;margin:0 auto;width:100%}
.view{display:none}
.view.on{display:block}
.vhead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.vhead h2{font-size:27px;margin:0}
.vsub{color:var(--ink2);margin:2px 0 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
  .side{width:64px;flex-basis:64px;padding:14px 8px}.side .bname,.side .bsub,.side .foot,.nav button span.lbl{display:none}
  .nav button{justify-content:center}.main{padding:18px 14px 50px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.card h3{margin:0 0 8px;font-size:16.5px}
.kpi .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.kpi .val{font-size:29px;font-weight:700;margin-top:3px;font-family:Georgia,serif}
.kpi .note{font-size:12.5px;color:var(--ink2);margin-top:2px}
.hero{background:linear-gradient(135deg,#0A1F33 0%,#0F2D4A 46%,#1E5D7A 100%);color:#fff;border:none;position:relative;overflow:hidden}
body.dark .hero{background:linear-gradient(135deg,#060D14,#0E2438 55%,#14425E)}
.hero .lab{color:#C8A878;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.hero .val{color:#fff;font-size:44px;font-family:Georgia,serif;font-weight:700;margin-top:3px}
.hero .note{color:#B9CBD8;font-size:13.5px;margin-top:3px}
.hero>*{position:relative;z-index:1}
.hero .scene{position:absolute;left:0;right:0;bottom:0;height:74px;z-index:0;opacity:.6;pointer-events:none}
.pill{display:inline-block;background:var(--gold);color:#0A1F33;font-weight:700;border-radius:999px;padding:3px 12px;font-size:12.5px}
.ok{color:var(--green)} .bad{color:var(--red)}
.badge-ok{background:var(--green-bg);color:var(--green);border-radius:8px;padding:2px 9px;font-weight:700;font-size:12.5px}
.badge-bad{background:var(--red-bg);color:var(--red);border-radius:8px;padding:2px 9px;font-weight:700;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:600;text-decoration:none;display:inline-block}
body.dark .btn{background:var(--gold);color:#0A1F33}
.btn.gold{background:var(--gold);color:#0A1F33}
.btn.teal{background:var(--ocean);color:#fff}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn.danger{background:none;color:var(--red);border:1px solid var(--red)}
form.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0 4px}
form.row label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.progress{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--gold)}
.route{position:relative;height:14px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 20px);border-radius:99px;margin:10px 0 2px}
.route>i{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--teal),var(--ocean));border-radius:99px}
.route>b{position:absolute;top:-7px;transform:translateX(-50%);color:var(--gold);font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.bar-note{font-size:12px;color:var(--ink2)}
.meter{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--green)}
.meter.hot>i{background:var(--red)}
.callout{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;font-size:14px}
.callout b{color:var(--ink)}
ul.tight{margin:6px 0;padding-left:19px} ul.tight li{margin:4px 0}
.small{font-size:12.5px;color:var(--ink2)}
.hr{height:1px;background:var(--line);margin:16px 0}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:99px;color:var(--ink2)}
select.cadence{font-weight:700}
svg text{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.nwbar{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
.nwbar>i{display:block;height:100%}
.tl{position:relative;height:34px;margin:14px 4px 2px}
.tl .rail{position:absolute;left:0;right:0;top:15px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--gold))}
.tl .dot{position:absolute;top:9px;width:15px;height:15px;border-radius:50%;background:var(--navy);border:3px solid var(--gold);transform:translateX(-50%)}

.tl .cap{position:absolute;top:22px;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);white-space:nowrap}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0A1F33}

<script>

/* ============================================================

const LS_KEY = "oreandtide.engine.v1";
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" +
  String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const P = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const ISO = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
  String(d.getDate()).padStart(2, "0");
const addDays = (s, n) => { const d = P(s); d.setDate(d.getDate() + n); return ISO(d); };
const addMonths = (s, n) => { const d = P(s); d.setMonth(d.getMonth() + n); return ISO(d); };
const daysBetween = (a, b) => Math.round((P(b) - P(a)) / 86400000);
const monthStart = s => s.slice(0, 7) + "-01";
const monthLabel = s => P(s).toLocaleDateString("en-US", { month: "short", year: "numeric" });
const money = n => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US",
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------------- sample data (fictional) ---------------- */

  const tx = [];
  const spend = [
    ["Groceries", [148, 162, 139, 171], "Fixed"], ["Fuel", [52, 48, 55], "Fixed"],
    ["Dining", [42, 58, 36], "Flexible"], ["Entertainment", [28, 45], "Flexible"],
    ["Household", [64, 38], "Fixed"], ["Personal Care", [35, 29], "Flexible"],
    ["Pets", [58], "Fixed"], ["Transportation", [46, 39], "Fixed"],
    ["Miscellaneous", [24, 31], "Flexible"], ["Health & Fitness", [52], "Fixed"],
  ];
  for (let m = 0; m < 4; m++) {
    const base = new Date(2026, 6 + m, 1); // Jul..Oct 2026
    spend.forEach(([cat, amts, kind], ci) => amts.forEach((a, i) => {
      const day = 2 + ((ci * 3 + i * 6 + m * 2) % 26);
      const dt = new Date(base.getFullYear(), base.getMonth(), Math.min(day, 28));
      tx.push({ id: uid(), date: ISO(dt), desc: cat + " (sample)", category: cat,
                dir: "Out", amount: Math.round(a * (1 + ((m + i) % 3) * 0.04)), kind });
    }));
    // big monthly outs so monthly totals look like a real household
    tx.push({ id: uid(), date: ISO(new Date(2026, 6 + m, 1)), desc: "Rent (sample)",
              category: "Housing", dir: "Out", amount: 1250, kind: "Fixed" });
    tx.push({ id: uid(), date: ISO(new Date(2026, 6 + m, 20)), desc: "Debt payments (sample)",
              category: "Debt Payments", dir: "Out", amount: 503, kind: "Fixed" });
    tx.push({ id: uid(), date: ISO(new Date(2026, 6 + m, 15)), desc: "Utilities & bills (sample)",
              category: "Utilities & Internet", dir: "Out", amount: 361, kind: "Fixed" });
    tx.push({ id: uid(), date: ISO(new Date(2026, 6 + m, 9)), desc: "Insurance & phone (sample)",
              category: "Insurance", dir: "Out", amount: 319, kind: "Fixed" });
  }
  return {
    settings: { asOf: "2026-10-29", cushion: 200, paychecksPerYear: 26, cadence: "Monthly",
                dark: false },
    accounts: [
      { id: uid(), name: "Everyday Checking", balance: 625.40, counts: true },

      { id: uid(), date: "2026-07-03", amount: 2440, received: true },
      { id: uid(), date: "2026-07-17", amount: 2452, received: true },
      { id: uid(), date: "2026-07-31", amount: 2446, received: true },

    ],
    future: [
      { id: uid(), name: "Car Insurance (6-month premium)", target: 700, saved: 250, due: "2026-11-03" },
      { id: uid(), name: "Holiday Gifts", target: 600, saved: 150, due: "2026-12-20" },
      { id: uid(), name: "Car Registration", target: 220, saved: 60, due: "2027-03-15" },
    ],
    goals: [
      { id: uid(), name: "Emergency Fund", target: 8000, saved: 3650, date: "2027-06-30" },
      { id: uid(), name: "Vacation", target: 2400, saved: 850, date: "2027-05-15" },
      { id: uid(), name: "New Tires", target: 900, saved: 300, date: "2027-01-31" },
    ],
  };
}

/* ---------------- state ---------------- */
let S;
function load() {
  try { const raw = localStorage.getItem(LS_KEY); S = raw ? JSON.parse(raw) : sampleData(); }
  catch (e) { S = sampleData(); }
  if (!S.settings) S = sampleData();
  if (!Array.isArray(S.debts)) S.debts = [];
}
let storageOK = true;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch (e) { storageOK = false; }
  const n = document.getElementById("savedNote");
  if (n) n.textContent = storageOK
    ? "Saved on this device · " + new Date().toLocaleTimeString("en-US",
        { hour: "numeric", minute: "2-digit" })
    : "This viewer can't save changes — open the file in a browser tab to keep your edits.";
}

/* ---------------- the engine ---------------- */
function monthlyEquivalent(b) {
  return { Weekly: b.amount * 52 / 12, Biweekly: b.amount * 26 / 12, Monthly: b.amount,
           Quarterly: b.amount / 3, Annual: b.amount / 12 }[b.freq] ?? b.amount;
}
function nextPayday() {
  const fut = S.paychecks.filter(p => !p.received && p.date >= S.settings.asOf)
    .sort((a, b) => a.date < b.date ? -1 : 1);
  if (fut.length) return fut[0].date;
  const any = S.paychecks.filter(p => p.date >= S.settings.asOf)
    .sort((a, b) => a.date < b.date ? -1 : 1);
  return any.length ? any[0].date : addDays(S.settings.asOf, 14);
}
function engine() {
  const asOf = S.settings.asOf, payday = nextPayday();
  const days = Math.max(1, daysBetween(asOf, payday));
  const eligible = S.accounts.filter(a => a.counts)
    .reduce((t, a) => t + (+a.balance || 0), 0);
  const dueBills = S.bills.filter(b => !b.paid && b.due >= asOf && b.due < payday);
  const billsDue = dueBills.reduce((t, b) => t + (+b.amount || 0), 0);
  const protectedDue = S.future.filter(f => f.due >= asOf && f.due < payday)
    .reduce((t, f) => t + Math.max(0, (+f.target || 0) - (+f.saved || 0)), 0);
  const sts = eligible - billsDue - protectedDue - (+S.settings.cushion || 0);
  const flex7 = S.transactions.filter(t => t.dir === "Out" && t.kind === "Flexible" &&
    t.date >= addDays(asOf, -6) && t.date <= asOf)
    .reduce((t, x) => t + (+x.amount || 0), 0);
  return { asOf, payday, days, eligible, dueBills, billsDue, protectedDue,
           sts, perDay: sts > 0 ? sts / days : 0,
           shortfall: Math.max(0, -sts), flex7, flexAvg: flex7 / 7,
           onPace: sts <= 0 ? false : (flex7 / 7) <= (sts / days) };
}
function monthlyIncome() {
  const fut = S.paychecks.filter(p => !p.received);
  const pool = fut.length ? fut : S.paychecks;
  const typical = pool.length ? pool.reduce((t, p) => t + (+p.amount || 0), 0) / pool.length : 0;
  return { typical, monthly: typical * (+S.settings.paychecksPerYear || 26) / 12 };
}
function cadencePeriods() {
  return { "Monthly": 12, "Semi-monthly": 24,
           "Per paycheck": (+S.settings.paychecksPerYear || 26) }[S.settings.cadence] || 12;
}
function monthOut(monthPrefix) {
  return S.transactions.filter(t => t.dir === "Out" && t.date.startsWith(monthPrefix))
    .reduce((t, x) => t + (+x.amount || 0), 0);
}
function netWorth() {
  const assets = S.accounts.reduce((t, a) => t + (+a.balance || 0), 0);
  const debtTotal = (S.debts || []).reduce((t, d) => t + (+d.balance || 0), 0);
  return { assets, debtTotal, net: assets - debtTotal };
}
function monthIn(monthPrefix) {
  const pay = S.paychecks.filter(p => p.received && p.date.startsWith(monthPrefix))
    .reduce((t, p) => t + (+p.amount || 0), 0);
  const tx = S.transactions.filter(t => t.dir === "In" && t.date.startsWith(monthPrefix))
    .reduce((t, x) => t + (+x.amount || 0), 0);
  return pay + tx;
}
function dataMonths() {
  const set = new Set();
  S.transactions.forEach(t => set.add(t.date.slice(0, 7)));
  S.paychecks.forEach(p => { if (p.received) set.add(p.date.slice(0, 7)); });
  const cur = S.settings.asOf.slice(0, 7);
  return [...set].sort()
    .filter(m => m <= cur && (monthIn(m) > 0 || monthOut(m) > 0)).slice(-6);
}
function sceneSVG() {
  return `<svg class="scene" viewBox="0 0 600 74" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 40 L70 12 L128 34 L205 4 L286 36 L352 16 L430 38 L505 14 L600 36 L600 74 L0 74 Z" fill="#3E8CA7" opacity=".45"/>

function cfChartSVG(rows) {
  const w = 560, h = 214, base = 168, max = Math.max(...rows.flatMap(r => [r.inn, r.out]), 1);
  const n = rows.length, x0 = 40, x1 = w - 34;
  const px = i => n === 1 ? (x0 + x1) / 2 : x0 + i * ((x1 - x0) / (n - 1));
  const py = v => base - Math.max(4, (v / max) * 122);
  const wave = key => {
    let d = `M${px(0)} ${py(rows[0][key])}`;
    for (let i = 1; i < n; i++) {
      const mx = (px(i - 1) + px(i)) / 2, my = (py(rows[i - 1][key]) + py(rows[i][key])) / 2;
      d += ` Q${px(i - 1)} ${py(rows[i - 1][key])} ${mx} ${my}`;
    }
    d += ` L${px(n - 1)} ${py(rows[n - 1][key])}`;
    return d;
  };
  const area = key => wave(key) + ` L${px(n - 1)} ${base} L${px(0)} ${base} Z`;
  let dots = "", labels = "";
  rows.forEach((r, i) => {
    dots += `<circle cx="${px(i)}" cy="${py(r.inn)}" r="3.4" fill="var(--teal)"></circle>
      <circle cx="${px(i)}" cy="${py(r.out)}" r="3.4" fill="var(--navy)"></circle>`;
    labels += `<text x="${px(i)}" y="${base + 19}" text-anchor="middle" font-size="11.5" fill="var(--ink2)">${r.label}</text>
      <text x="${px(i)}" y="${base + 35}" text-anchor="middle" font-size="11" font-weight="700" fill="${r.net >= 0 ? "var(--green)" : "var(--red)"}">${r.net >= 0 ? "+" : "\u2212"}${money(Math.abs(r.net)).slice(0)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Cash flow by month, drawn as tide waves">
    <defs>
      <linearGradient id="tideIn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3E8CA7" stop-opacity=".5"/><stop offset="1" stop-color="#3E8CA7" stop-opacity=".07"/>
      </linearGradient>
      <linearGradient id="tideOut" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0F2D4A" stop-opacity=".55"/><stop offset="1" stop-color="#0F2D4A" stop-opacity=".16"/>
      </linearGradient>
    </defs>
    <path d="${area("out")}" fill="url(#tideOut)"></path>
    <path d="${area("inn")}" fill="url(#tideIn)"></path>
    <path d="${wave("inn")}" stroke="var(--teal)" stroke-width="2.6" fill="none"></path>
    <path d="${wave("out")}" stroke="var(--navy)" stroke-width="2.2" fill="none" opacity=".75"></path>
    ${dots}<line x1="14" y1="${base}" x2="${w - 8}" y2="${base}" stroke="var(--gold)" stroke-width="2"/>
    ${labels}</svg>`;
}
let aiQ = "Give me a plain-language read on my money: am I on track this pay period, where is my spending leaking, and what is the one move that would help most?";
function aiSummary() {
  const e = engine(), nw = netWorth();
  const from = addDays(e.asOf, -29);
  const byCat = {};
  S.transactions.filter(t => t.dir === "Out" && t.date >= from && t.date <= e.asOf)
    .forEach(t => byCat[t.category] = (byCat[t.category] || 0) + (+t.amount || 0));
  const topCats = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([c, v]) => `${c} ${money(v)}`).join("; ") || "none logged";
  const bills = e.dueBills.slice(0, 5).map(b => `${b.name} ${money(b.amount)} due ${b.due}`).join("; ") || "none";
  const goals = S.goals.map(g => `${g.name} ${Math.min(100, Math.round((+g.saved || 0) / Math.max(1, +g.target || 1) * 100))}% funded (${money(g.saved)} of ${money(g.target)})`).join("; ") || "none";
  const debts = (S.debts || []).map(d => `${d.name} ${money(d.balance)} at ${d.apr}% APR`).join("; ") || "none";
  const cf = dataMonths().map(m => {
    const net = monthIn(m) - monthOut(m);
    return `${monthLabel(m + "-01").split(" ")[0]} ${net >= 0 ? "+" : "−"}${money(Math.abs(net)).slice(0)}`;
  }).join("; ");
  return `Here is my money snapshot from the Ore & Tide Financial Engine, as of ${e.asOf}. Please work only from these figures.

SAFE TO SPEND: ${money(Math.max(0, e.sts))} — ${money(e.perDay)} per day for ${e.days} days, until payday ${e.payday}. Eligible cash ${money(e.eligible)}; bills reserved ${money(e.billsDue)}; protected ${money(e.protectedDue)}; cushion ${money(+S.settings.cushion || 0)}.
NET WORTH: ${nw.net < 0 ? "−" : ""}${money(Math.abs(nw.net)).slice(0)} (accounts ${money(nw.assets)} minus debts ${money(nw.debtTotal)}).
DEBTS: ${debts}.
BILLS DUE BEFORE PAYDAY: ${bills}.
SPENDING, LAST 30 DAYS, TOP CATEGORIES: ${topCats}.
GOALS: ${goals}.
MONTHLY CASH FLOW (net): ${cf}.

MY QUESTION: ${aiQ}

Answer in plain language, use my numbers, and give specific next steps — no generic advice.`;
}
function catMonthOut(cat, monthPrefix) {
  return S.transactions.filter(t => t.dir === "Out" && t.category === cat &&
    t.date.startsWith(monthPrefix)).reduce((t, x) => t + (+x.amount || 0), 0);
}

function barChartSVG(pairs, color) {
  const w = 520, h = 196, base = 158, max = Math.max(...pairs.map(p => p[1]), 1);
  const n = pairs.length, x0 = 38, x1 = w - 32;
  const px = i => n === 1 ? (x0 + x1) / 2 : x0 + i * ((x1 - x0) / (n - 1));
  const py = v => base - Math.max(10, (v / max) * 104);
  const saddle = i => {
    const mx = (px(i) + px(i + 1)) / 2;
    const sy = Math.min(base - 6, Math.max(py(pairs[i][1]), py(pairs[i + 1][1])) + 22);
    return [mx, sy];
  };
  const scaled = (scale, lift) => {
    let d = `M6 ${base}`;
    pairs.forEach(([lab, v], i) => {
      if (i > 0) { const [mx, sy] = saddle(i - 1);
        d += ` L${mx.toFixed(1)} ${(base - (base - sy) * scale - lift).toFixed(1)}`; }
      d += ` L${px(i).toFixed(1)} ${(base - (base - py(v)) * scale - lift).toFixed(1)}`;
    });
    return { area: d + ` L${w - 4} ${base} Z`, line: d };
  };
  const pts = pairs.map(([lab, v], i) => [px(i), py(v)]);
  let front = `M6 ${base}`, frontLine = `M6 ${base}`;
  pairs.forEach(([lab, v], i) => {
    if (i > 0) {
      const [sx, sy] = saddle(i - 1);
      const c1x = pts[i - 1][0] + (sx - pts[i - 1][0]) * 0.55, c1y = Math.min(base - 4, pts[i - 1][1] + (sy - pts[i - 1][1]) * 0.42 + 7);
      const c2x = sx + (pts[i][0] - sx) * 0.45, c2y = Math.min(base - 4, sy + (pts[i][1] - sy) * 0.35 + 5);
      front += ` L${c1x.toFixed(1)} ${c1y.toFixed(1)} L${sx.toFixed(1)} ${sy.toFixed(1)} L${c2x.toFixed(1)} ${c2y.toFixed(1)}`;
      frontLine += ` L${c1x.toFixed(1)} ${c1y.toFixed(1)} L${sx.toFixed(1)} ${sy.toFixed(1)} L${c2x.toFixed(1)} ${c2y.toFixed(1)}`;
    }
    front += ` L${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;
    frontLine += ` L${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;
  });
  const frontArea = front + ` L${w - 4} ${base} Z`;
  let labels = "";
  pairs.forEach(([lab, v], i) => {
    labels += `<text x="${px(i)}" y="${base + 21}" text-anchor="middle" font-size="11.5" fill="var(--ink2)">${esc(lab)}</text>
      <text x="${px(i)}" y="${py(v) - 11}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)" style="paint-order:stroke;stroke:rgba(255,255,255,.8);stroke-width:3">$${Math.round(v).toLocaleString()}</text>`;
  });
  const sunX = px(n - 1), sunY = Math.max(16, py(pairs[n - 1][1]) - 24);
  const far = scaled(0.52, 14), mid = scaled(0.78, 6);
  const shore = `M6 ${base + 5} Q 42 ${base - 1} 78 ${base + 5} T 150 ${base + 5} T 222 ${base + 5} T 294 ${base + 5} T 366 ${base + 5} T 438 ${base + 5} T 510 ${base + 5}`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Spending by month — a real mountain range that grows and shrinks with your spending">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#DCEBF3"/><stop offset=".7" stop-color="#EFF5F8"/><stop offset="1" stop-color="#F7ECD9"/>
      </linearGradient>
      <linearGradient id="frontShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0F2D4A" stop-opacity="0"/><stop offset="1" stop-color="#0F2D4A" stop-opacity=".34"/>
      </linearGradient>
      <filter id="mistBlur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
      <clipPath id="clipFar"><path d="${far.area}"/></clipPath>
      <clipPath id="clipMid"><path d="${mid.area}"/></clipPath>
      <clipPath id="clipFront"><path d="${frontArea}"/></clipPath>
    </defs>
    <rect x="2" y="2" width="${w - 4}" height="${base}" rx="10" fill="url(#skyGrad)"></rect>
    <circle cx="${sunX}" cy="${sunY}" r="17" fill="#D4AF7A" opacity=".28"></circle>
    <circle cx="${sunX}" cy="${sunY}" r="8.5" fill="#D4AF7A"></circle>
    <g class="rangeGrow">
      <g clip-path="url(#clipFar)"><image href="${MTN_IMG}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMin slice" opacity=".55"></image><rect x="0" y="0" width="${w}" height="${h}" fill="#DCEBF3" opacity=".5"></rect></g>
      <g clip-path="url(#clipMid)"><image href="${MTN_IMG}" x="-60" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMin slice" opacity=".8"></image><rect x="0" y="0" width="${w}" height="${h}" fill="#5E93AC" opacity=".32"></rect></g>
      <g clip-path="url(#clipFront)"><image href="${MTN_IMG}" x="-130" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMin slice"></image><rect x="0" y="0" width="${w}" height="${h}" fill="url(#frontShade)"></rect></g>
      <path d="${frontLine}" fill="none" stroke="#0A1F33" stroke-width="1.6" opacity=".55"></path>
      <ellipse cx="${w * 0.42}" cy="${base - 30}" rx="150" ry="9" fill="#FFFFFF" opacity=".18" filter="url(#mistBlur)"></ellipse>
    </g>
    <path d="${shore}" stroke="var(--teal)" stroke-width="2" fill="none" opacity=".65"></path>
    <g class="fadeIn">${labels}</g></svg>`;
}
function donutSVG(pairs) {
  const total = pairs.reduce((t, p) => t + p[1], 0) || 1;
  const cols = ["#0F2D4A", "#1E5D7A", "#3E8CA7", "#D4AF7A", "#7FB3C8", "#C8A878", "#64748B", "#2E7D46"];
  let a = -Math.PI / 2, paths = "";
  const cx = 90, cy = 90, r = 74, ir = 44;
  pairs.forEach(([lab, v], i) => {
    if (v <= 0) return;
    const a2 = a + (v / total) * Math.PI * 2, large = (a2 - a) > Math.PI ? 1 : 0;
    const p = (ang, rad) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)];
    const [x1, y1] = p(a, r), [x2, y2] = p(a2, r), [x3, y3] = p(a2, ir), [x4, y4] = p(a, ir);
    paths += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${ir},${ir} 0 ${large} 0 ${x4},${y4} Z" fill="${cols[i % cols.length]}"></path>`;
    a = a2;
  });
  const legend = pairs.map(([lab, v], i) =>
    `<div style="display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px">
      <span style="width:11px;height:11px;border-radius:3px;background:${cols[i % cols.length]};display:inline-block"></span>
      <span style="flex:1">${esc(lab)}</span><b>${money(v)}</b></div>`).join("");
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 180 180" width="168" height="168" role="img">${paths}
      <text x="90" y="86" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink)">${money(total)}</text>
      <text x="90" y="103" text-anchor="middle" font-size="9.5" fill="var(--ink2)">per month</text></svg>
    <div style="flex:1;min-width:170px">${legend}</div></div>`;
}
function runToPaydaySVG(e) {
  const start = S.paychecks.filter(p => p.received && p.date <= e.asOf)
    .sort((a, b) => a.date < b.date ? 1 : -1)[0];
  const startDate = start ? start.date : addDays(e.asOf, -13);
  const days = [];
  for (let d = startDate; d <= e.asOf; d = addDays(d, 1)) {
    const spent = S.transactions.filter(t => t.dir === "Out" && t.kind === "Flexible" &&
      t.date === d).reduce((t, x) => t + (+x.amount || 0), 0);
    days.push([d.slice(8), spent]);
  }
  const w = 520, h = 150, base = 122, max = Math.max(e.perDay * 1.6, ...days.map(d => d[1]), 1);
  const bw = Math.max(8, Math.min(30, (w - 50) / Math.max(days.length, 1) - 8));
  let bars = "", labels = "";
  days.forEach(([lab, v], i) => {
    const x = 26 + i * ((w - 46) / Math.max(days.length, 1)), bh = Math.max(1, (v / max) * 88);
    bars += `<rect x="${x}" y="${base - bh}" width="${bw}" height="${bh}" rx="3"
      fill="${v > e.perDay ? "var(--red)" : "var(--green)"}"></rect>`;
    if (i % 2 === 0 || days.length <= 8) labels += `<text x="${x + bw / 2}" y="${base + 15}"
      text-anchor="middle" font-size="10" fill="var(--ink2)">${lab}</text>`;
  });
  const dy = base - (e.perDay / max) * 88;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${bars}
    <line x1="16" y1="${dy}" x2="${w - 8}" y2="${dy}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="${w - 10}" y="${dy - 5}" text-anchor="end" font-size="10.5" fill="var(--ink2)">daily amount ${money(e.perDay)}</text>
    <line x1="16" y1="${base}" x2="${w - 8}" y2="${base}" stroke="var(--line)" stroke-width="2"/>${labels}</svg>`;
}

    `<button class="chip ${aiQ === c ? "on" : ""}" data-aiq="${i}">Question ${i + 1}</button>`).join("");
  return `
  <div class="vhead"><h2>Ask AI ✧</h2></div>
  <p class="vsub">Your numbers, your AI account, one tap. The Engine writes a short, plain-language summary of your money — read it below; it is exactly what gets sent. Nothing is uploaded and nothing is shared with Ore &amp; Tide: the buttons simply open your own ChatGPT or Claude with the summary already typed in. Press send there, and ask follow-ups like you would a person.</p>
  <div class="card">
    <h3>Pick a question</h3>
    <div class="airow">${chipHtml}</div>
    <p class="small" style="margin:0 0 6px">${esc(aiQ)}</p>
    <h3 style="margin-top:14px">Your summary</h3>
    <textarea id="aiText" readonly>${esc(text)}</textarea>
    <div class="airow">
      <a class="btn teal" target="_blank" rel="noopener" href="https://chatgpt.com/?q=${enc}">Ask ChatGPT →</a>
      <a class="btn gold" target="_blank" rel="noopener" href="https://claude.ai/new?q=${enc}">Ask Claude →</a>
      <button class="btn ghost" id="copyAi">Copy summary</button>
    </div>
    <p class="small">No AI account? Copy the summary and paste it into any assistant — or just read it yourself; it is a decent one-page state of your money. Tip: in the AI chat you can also ask it to explain any number here.</p>
  </div>`;
}

function goalCard(g, isFuture) {
  const when = g.date || g.due;
  const pct = Math.min(100, Math.round((+g.saved || 0) / Math.max(1, +g.target || 1) * 100));
  const months = Math.max(1, Math.round(daysBetween(S.settings.asOf, when) / 30.44));
  const need = Math.max(0, (+g.target || 0) - (+g.saved || 0));
  return `<div class="card">
    <h3>${esc(g.name)}</h3>
    <div class="route"><i style="width:${pct}%"></i><b style="left:${pct}%">◆</b></div>
    <p style="margin:8px 0 2px"><b>${money(g.saved)}</b> of ${money(g.target)} · ${pct}%</p>
    <p class="small" style="margin:0">Target date ${esc(when)} · still needs ${money(need)} · pace ≈ <b>${money(need / months)}/mo</b></p>
    <form class="row" data-save-form="${isFuture ? "future" : "goal"}" data-id="${g.id}">
      <label>Saved <input type="number" step="0.01" name="saved" value="${g.saved}" style="width:110px"></label>
      <button class="btn sm" type="submit">Update</button>
      <button class="btn sm danger" type="button" data-del-${isFuture ? "future" : "goal"}="${g.id}">Delete</button>
    </form></div>`;
}
function vGoals() {
  return `
  <div class="vhead"><h2>Goals &amp; Future Expenses</h2></div>
  <p class="vsub">Future expenses due before payday are protected in Safe to Spend at their remaining amount — a $600 bill becomes a plan, not a surprise.</p>
  <h3 class="serif" style="margin:14px 0 8px">Savings goals</h3>
  <div class="grid g3">${S.goals.map(g => goalCard(g, false)).join("")}</div>
  <form class="row" id="addGoal">
    <label>Name <input required name="name"></label><label>Target <input required type="number" step="0.01" name="target" style="width:110px"></label>
    <label>Saved <input type="number" step="0.01" name="saved" value="0" style="width:110px"></label>
    <label>By date <input required type="date" name="date"></label>
    <button class="btn" type="submit">+ Add goal</button></form>
  <h3 class="serif" style="margin:20px 0 8px">Future expenses</h3>
  <div class="grid g3">${S.future.map(f => goalCard(f, true)).join("")}</div>
  <form class="row" id="addFuture">
    <label>Name <input required name="name"></label><label>Target <input required type="number" step="0.01" name="target" style="width:110px"></label>
    <label>Saved <input type="number" step="0.01" name="saved" value="0" style="width:110px"></label>
    <label>Due date <input required type="date" name="date"></label>
    <button class="btn" type="submit">+ Add future expense</button></form>`;
}

function vInsights() {
  const inc = monthlyIncome();
  const totB = S.categories.reduce((t, c) => t + (+c.budget || 0), 0);
  const surplus = inc.monthly - totB;
  const mp = S.settings.asOf.slice(0, 7);
  const overs = S.categories.map(c => ({ name: c.name, b: +c.budget || 0, a: catMonthOut(c.name, mp) }))
    .filter(x => x.a > x.b && x.b > 0).sort((a, b) => (b.a - b.b) - (a.a - a.b));
  const e = engine();
  const nextBill = S.bills.filter(b => !b.paid && b.due >= e.asOf)
    .sort((a, b) => a.due < b.due ? -1 : 1)[0];
  return `
  <div class="vhead"><h2>Insights</h2></div>
  <p class="vsub">Read from the same figures as everything else. Prompts, not orders.</p>
  <div class="grid g2">
    <div class="card"><h3>Suggested split of planned surplus</h3>
      <p>Planned monthly surplus: <b>${money(surplus)}</b> (income ${money(inc.monthly)} − budget ${money(totB)}).</p>
      <ul class="tight">
        <li><b>50%</b> to goals &amp; savings — ${money(Math.max(0, surplus) * 0.5)}</li>
        <li><b>30%</b> to future expenses — ${money(Math.max(0, surplus) * 0.3)}</li>
        <li><b>20%</b> kept as buffer — ${money(Math.max(0, surplus) * 0.2)}</li>
      </ul></div>
    <div class="card"><h3>Watch items</h3>
      <ul class="tight">
        <li>Pace: ${e.sts <= 0 ? "no Safe to Spend room right now — see Today." :
          e.onPace ? "on pace — flexible spending is within your daily amount." :
          "running hot — flexible spending is above your daily amount."}</li>
        ${nextBill ? `<li>Next bill: <b>${esc(nextBill.name)}</b> ${money(nextBill.amount)} on ${esc(nextBill.due)}.</li>` : ""}
        <li>${e.dueBills.length} bill(s) totaling ${money(e.billsDue)} are reserved before payday (${esc(e.payday)}).</li>
      </ul></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Categories over budget this month</h3>
    ${overs.length ? `<table><tr><th>Category</th><th class="num">Budget</th><th class="num">Actual</th><th class="num">Over by</th></tr>
      ${overs.map(o => `<tr><td>${esc(o.name)}</td><td class="num">${money(o.b)}</td><td class="num">${money(o.a)}</td><td class="num">${money(o.a - o.b)}</td></tr>`).join("")}</table>`
      : `<p class="small">Nothing over budget this month. Quietly excellent.</p>`}
  </div>`;
}

function amortize(balance, aprPct, payment) {
  let bal = balance, months = 0, interest = 0; const r = aprPct / 100 / 12;
  while (bal > 0 && months < 600) {
    const i = bal * r; interest += i; bal = bal + i - payment; months++;
    if (payment <= i && bal > balance) break;
  }
  return { months, interest };
}
function vWhatif() {
  return `
  <div class="vhead"><h2>What-If</h2></div>
  <p class="vsub">Test a decision against the same numbers the Dashboard uses — before you commit.</p>
  <div class="grid g2">
    <div class="card"><h3>Test a purchase</h3>
      <form class="row" id="wiBuy">
        <label>Purchase amount <input required type="number" step="0.01" min="0" name="amount" style="width:130px"></label>
        <button class="btn" type="submit">Test it</button></form>

        <label>APR % <input required type="number" step="0.01" name="apr" style="width:80px"></label>
        <label>Monthly payment <input required type="number" step="0.01" name="pay" style="width:110px"></label>
        <label>Extra / month <input type="number" step="0.01" name="extra" value="0" style="width:100px"></label>
        <button class="btn" type="submit">Run it</button></form>

}

function vHelp() {
  return `
  <div class="vhead"><h2>How to Use</h2></div>
  <p class="vsub">Ten minutes to set up. Ten seconds every morning after that.</p>
  <div class="card">
    <h3>The one idea: Safe to Spend</h3>
    <p>The Engine takes the cash in the accounts you mark as counting, reserves every bill due
    before your next payday at full value, sets aside future expenses coming due and your cushion —
    and what is left is Safe to Spend. If the result is negative it shows $0 and states the shortfall
    plainly. It never borrows from next month to make today look better.</p>
    <h3>Setup, in order</h3>
    <ul class="tight">
      <li><b>Settings</b> — set the “as of” date (update it when you sit down), your cash cushion, and paychecks per year (26 biweekly · 24 twice-monthly · 12 monthly).</li>
      <li><b>Money &amp; Paychecks</b> — list your accounts and balances; mark which count toward Safe to Spend. Add paychecks, past as Received and upcoming as Future.</li>
      <li><b>Bills</b> — one row per obligation with its next due date.</li>
      <li><b>Budget</b> — a monthly budget per category; use the cadence selector to view the plan monthly, semi-monthly, or per paycheck.</li>
      <li><b>Goals &amp; Future</b> — goals with target dates, and irregular expenses (insurance, holidays) as future expenses.</li>
    </ul>
    <h3>The rhythm</h3>
    <ul class="tight">
      <li><b>Each morning:</b> glance at Today — Safe to Spend, pace, bills due.</li>
      <li><b>As money moves:</b> log transactions (or batch weekly). Category names should match the Budget list; mark flexible spending Flexible.</li>
      <li><b>On payday:</b> mark the paycheck received, add the next ones, re-check Safe to Spend.</li>
      <li><b>Monthly:</b> skim Insights and adjust one or two category budgets.</li>
    </ul>
    <h3>The wider view</h3>
    <ul class="tight">
      <li><b>Net worth</b> — Money &amp; Paychecks now tracks debts (balance + APR) alongside accounts, so Today can show what you are worth on paper, not just what you can spend.</li>
      <li><b>Cash Flow</b> — money in vs money out by month, with each month's net. Three-paycheck months and heavy bill months stop being surprises.</li>
      <li><b>Ask AI</b> — one tap takes a short written summary of your numbers to your own ChatGPT or Claude account. Nothing is uploaded; the summary opens pre-typed in your AI, and you press send. Ore &amp; Tide never sees it.</li>
      <li><b>Search</b> — the Transactions page filters as you type: a category, a word, or a month like 2026-10.</li>
    </ul>
    <h3>Honest limits</h3>
    <p>Manual entry by design — this app does not connect to your bank, which is what makes it work
    for any account mix, including cash. Your data is stored only in this browser on this device;
    use Settings → Export backup regularly, and Import it if you move devices. This is a planning
    tool, not financial advice.</p>
  </div>`;
}

function vSettings() {
  return `
  <div class="vhead"><h2>Settings</h2></div>
  <p class="vsub">Your data lives only in this browser. Back it up before switching devices or clearing site data.</p>
  <div class="card">
    <form class="row" id="setForm">
      <label>As of date <input type="date" name="asOf" value="${esc(S.settings.asOf)}"></label>
      <label>Cash cushion ($) <input type="number" step="0.01" min="0" name="cushion" value="${S.settings.cushion}" style="width:110px"></label>
      <label>Paychecks / year <input type="number" step="1" min="1" name="ppy" value="${S.settings.paychecksPerYear}" style="width:90px"></label>
      <button class="btn" type="submit">Save settings</button>
      <button class="btn ghost" type="button" id="useToday">Use today's date</button>
    </form>
    <div class="hr"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ghost" id="exportBtn" type="button">⭳ Export backup (JSON)</button>
      <label class="btn ghost" style="display:inline-flex;align-items:center">⭱ Import backup
        <input type="file" id="importFile" accept="application/json" style="display:none"></label>
      <button class="btn ghost" id="printBtn" type="button">⎙ Print</button>
      <button class="btn danger" id="resetBtn" type="button">Reset to sample data</button>
      <button class="btn danger" id="wipeBtn" type="button">Erase everything</button>
    </div>
    <p class="small" style="margin-top:10px">Reset restores the fictional sample household. Erase clears all data and starts with empty lists (settings kept).</p>
  </div>`;
}

/* ---------------- render + wiring ---------------- */
const RENDER = { today: vToday, money: vMoney, budget: vBudget, bills: vBills,
  transactions: vTransactions, cashflow: vCashflow, goals: vGoals, insights: vInsights,
  askai: vAskAI, whatif: vWhatif, help: vHelp, settings: vSettings };
function render() {
  document.getElementById("nav").innerHTML = VIEWS.map(([id, ico, lbl]) =>
    `<button data-view="${id}" class="${curView === id ? "on" : ""}">
       <span class="ico">${ico}</span><span class="lbl">${lbl}</span></button>`).join("");
  document.body.classList.toggle("dark", !!S.settings.dark);
  document.getElementById("themeBtn").textContent = S.settings.dark ? "☀ Light mode" : "☾ Dark mode";
  document.getElementById("main").innerHTML = RENDER[curView]();
  wire();
}
function fd(form) { return Object.fromEntries(new FormData(form).entries()); }
function wire() {
  document.querySelectorAll("[data-view]").forEach(b =>
    b.addEventListener("click", () => { curView = b.dataset.view; render(); }));
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };

  on("quickLog", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    S.transactions.push({ id: uid(), date: S.settings.asOf, desc: f.desc || "Quick log",
      category: f.category, dir: "Out", amount: +f.amount || 0, kind: "Flexible" });
    save(); render(); });

  on("addAcc", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    S.accounts.push({ id: uid(), name: f.name, balance: +f.balance || 0, counts: f.counts === "1" });
    save(); render(); });
  document.querySelectorAll("[data-acc]").forEach(inp => inp.addEventListener("change", () => {
    const a = S.accounts.find(x => x.id === inp.dataset.id); if (!a) return;
    if (inp.dataset.acc === "name") a.name = inp.value;
    if (inp.dataset.acc === "balance") a.balance = +inp.value || 0;
    if (inp.dataset.acc === "counts") a.counts = inp.checked;
    save(); render(); }));
  document.querySelectorAll("[data-del-acc]").forEach(b => b.addEventListener("click", () => {
    S.accounts = S.accounts.filter(x => x.id !== b.dataset.delAcc); save(); render(); }));

  on("addPay", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    S.paychecks.push({ id: uid(), date: f.date, amount: +f.amount || 0, received: f.received === "1" });
    save(); render(); });
  document.querySelectorAll("[data-recv]").forEach(b => b.addEventListener("click", () => {
    const p = S.paychecks.find(x => x.id === b.dataset.recv); if (p) p.received = true;
    save(); render(); }));
  document.querySelectorAll("[data-del-pay]").forEach(b => b.addEventListener("click", () => {
    S.paychecks = S.paychecks.filter(x => x.id !== b.dataset.delPay); save(); render(); }));

  on("addDebt", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    if (!Array.isArray(S.debts)) S.debts = [];
    S.debts.push({ id: uid(), name: f.name, balance: +f.balance || 0, apr: +f.apr || 0 });
    save(); render(); });
  document.querySelectorAll("[data-debt]").forEach(inp => inp.addEventListener("change", () => {
    const d = (S.debts || []).find(x => x.id === inp.dataset.id); if (!d) return;
    if (inp.dataset.debt === "name") d.name = inp.value;
    if (inp.dataset.debt === "balance") d.balance = +inp.value || 0;
    if (inp.dataset.debt === "apr") d.apr = +inp.value || 0;
    save(); render(); }));
  document.querySelectorAll("[data-del-debt]").forEach(b => b.addEventListener("click", () => {
    S.debts = (S.debts || []).filter(x => x.id !== b.dataset.delDebt); save(); render(); }));

  const ts = document.getElementById("txSearch");
  if (ts) ts.addEventListener("input", () => {
    txQuery = ts.value; render();
    const s2 = document.getElementById("txSearch");
    if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); } });

  document.querySelectorAll("[data-aiq]").forEach(b => b.addEventListener("click", () => {
    aiQ = [
      "Give me a plain-language read on my money: am I on track this pay period, where is my spending leaking, and what is the one move that would help most?",
      "Look at my debts and cash flow: what is the fastest sensible order to pay them down, and what would it save me?",
      "Can I afford a $300 purchase this pay period? Walk through what it does to my Safe to Spend and my goals before you answer.",
      "Build me a simple plan for next month from these numbers: three moves, in order, with the dollar effect of each.",
    ][+b.dataset.aiq] || aiQ;
    render(); }));
  on("copyAi", "click", () => {
    const t = document.getElementById("aiText");
    const done = () => { const b = document.getElementById("copyAi"); if (b) b.textContent = "Copied ✓"; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, done);
    else { t.select(); try { document.execCommand("copy"); } catch (e) {} done(); } });

  const cad = document.getElementById("cadenceSel");
  if (cad) cad.addEventListener("change", () => { S.settings.cadence = cad.value; save(); render(); });
  document.querySelectorAll("[data-cat]").forEach(inp => inp.addEventListener("change", () => {
    const c = S.categories.find(x => x.id === inp.dataset.cat); if (c) c.budget = +inp.value || 0;
    save(); render(); }));

  on("addBill", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    S.bills.push({ id: uid(), name: f.name, category: f.category, amount: +f.amount || 0,
      freq: f.freq, due: f.due, paid: false }); save(); render(); });
  document.querySelectorAll("[data-paid]").forEach(b => b.addEventListener("click", () => {
    const bill = S.bills.find(x => x.id === b.dataset.paid); if (!bill) return;
    bill.due = { Weekly: addDays(bill.due, 7), Biweekly: addDays(bill.due, 14),
      Monthly: addMonths(bill.due, 1), Quarterly: addMonths(bill.due, 3),
      Annual: addMonths(bill.due, 12) }[bill.freq] || addMonths(bill.due, 1);
    save(); render(); }));
  document.querySelectorAll("[data-del-bill]").forEach(b => b.addEventListener("click", () => {
    S.bills = S.bills.filter(x => x.id !== b.dataset.delBill); save(); render(); }));

  on("addTx", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    S.transactions.push({ id: uid(), date: f.date, desc: f.desc, category: f.category,
      dir: f.dir, amount: +f.amount || 0, kind: f.kind }); save(); render(); });
  document.querySelectorAll("[data-del-tx]").forEach(b => b.addEventListener("click", () => {
    S.transactions = S.transactions.filter(x => x.id !== b.dataset.delTx); save(); render(); }));

  document.querySelectorAll("[data-save-form]").forEach(form => form.addEventListener("submit", ev => {
    ev.preventDefault(); const f = fd(form);
    const list = form.dataset.saveForm === "future" ? S.future : S.goals;
    const item = list.find(x => x.id === form.dataset.id);
    if (item) item.saved = +f.saved || 0; save(); render(); }));
  document.querySelectorAll("[data-del-goal]").forEach(b => b.addEventListener("click", () => {
    S.goals = S.goals.filter(x => x.id !== b.dataset.delGoal); save(); render(); }));
  document.querySelectorAll("[data-del-future]").forEach(b => b.addEventListener("click", () => {
    S.future = S.future.filter(x => x.id !== b.dataset.delFuture); save(); render(); }));
  on("addGoal", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    S.goals.push({ id: uid(), name: f.name, target: +f.target || 0, saved: +f.saved || 0, date: f.date });
    save(); render(); });
  on("addFuture", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    S.future.push({ id: uid(), name: f.name, target: +f.target || 0, saved: +f.saved || 0, date: f.date });
    save(); render(); });

  on("wiBuy", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    const e = engine(), amt = +f.amount || 0, after = e.sts - amt;
    document.getElementById("wiBuyOut").innerHTML = `<div class="callout" style="margin-top:12px">
      Safe to Spend now: <b>${money(Math.max(0, e.sts))}</b> (${money(e.perDay)}/day).<br>
      After a ${money(amt)} purchase: <b>${money(Math.max(0, after))}</b>
      (${money(after > 0 ? after / e.days : 0)}/day for ${e.days} days).<br>
      ${after >= 0 ? "Bills due before payday stay reserved and covered."
        : `<b class="bad">That purchase would break the reserve by ${money(-after)} — bills would not stay covered.</b>`}
      </div>`; });
  on("wiDebt", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    const base = amortize(+f.balance, +f.apr, +f.pay);
    const extra = amortize(+f.balance, +f.apr, +f.pay + (+f.extra || 0));
    const fmt = r => r.months >= 600 ? "payment doesn't cover interest"
      : `${r.months} months · ${money(r.interest)} interest`;
    document.getElementById("wiDebtOut").innerHTML = `<div class="callout" style="margin-top:12px">
      At ${money(+f.pay)}/mo: <b>${fmt(base)}</b>.<br>
      With ${money(+f.extra || 0)} extra: <b>${fmt(extra)}</b>
      ${extra.months < base.months ? `— debt-free ${base.months - extra.months} months sooner, saving ${money(base.interest - extra.interest)}.` : ""}
      </div>`; });

  on("setForm", "submit", ev => { ev.preventDefault(); const f = fd(ev.target);
    S.settings.asOf = f.asOf || S.settings.asOf;
    S.settings.cushion = +f.cushion || 0;
    S.settings.paychecksPerYear = Math.max(1, +f.ppy || 26);
    save(); render(); });
  on("useToday", "click", () => { S.settings.asOf = todayISO(); save(); render(); });
  on("printBtn", "click", () => window.print());
  on("exportBtn", "click", () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "financial-engine-backup.json"; a.click();
    URL.revokeObjectURL(a.href); });
  const imp = document.getElementById("importFile");
  if (imp) imp.addEventListener("change", () => {
    const file = imp.files[0]; if (!file) return;
    file.text().then(txt => { try { const data = JSON.parse(txt);
      if (!data.settings || !data.accounts) throw new Error("bad file");
      if (!Array.isArray(data.debts)) data.debts = [];
      S = data; save(); render(); alert("Backup imported.");
    } catch (e) { alert("That file could not be imported."); } }); });
  on("resetBtn", "click", () => { if (confirm("Replace everything with the fictional sample household?")) {
    S = sampleData(); save(); curView = "today"; render(); } });
  on("wipeBtn", "click", () => { if (confirm("Erase all accounts, bills, transactions, goals? Settings stay.")) {
    S.accounts = []; S.paychecks = []; S.bills = []; S.transactions = []; S.debts = [];
    S.future = []; S.goals = []; save(); render(); } });
}
document.getElementById("themeBtn").addEventListener("click", () => {
  S.settings.dark = !S.settings.dark; save(); render(); });
load();
render();
</script>
</body>
</html>
