<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ore &amp; Tide · Proof slice — engine on the real route</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #050f1d; color: #e6eef6; font: 14px Inter, system-ui, sans-serif; }
    main { max-width: 1050px; margin: auto; padding: 18px; }
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 15px; letter-spacing: .22em; margin: 0 0 5px; color: #f5ead2; font-weight: 700; }
    header p, footer p { margin: 4px 0; color: #8fa9bf; font-size: 12px; }
    footer { text-align: center; margin-top: 10px; }
    .frame { position: relative; width: 100%; max-width: 430px; height: min(86vh, 880px); min-height: 560px;
             margin: auto; border: 1px solid rgba(212,168,87,.35); border-radius: 22px; overflow: hidden;
             box-shadow: 0 22px 60px rgba(0,0,0,.55); background: #0c2748; }
    .frame > .map { position: absolute; inset: 0; height: 100%; width: 100%; }
    .banner { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 5;
              background: rgba(8,24,44,.92); border: 1px solid rgba(255,255,255,.10);
              border-radius: 16px; padding: 12px 15px; backdrop-filter: blur(3px); }
    .kicker { font-size: 10.5px; letter-spacing: .26em; color: #d4a857; font-weight: 700; }
    .banner-title { font-family: Georgia, 'Times New Roman', serif; font-size: 23px; color: #f5ead2; margin: 2px 0 1px; }
    .banner-sub { color: #a9c2d8; font-size: 12.5px; }
    .queue { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
    .chip { background: rgba(38,68,102,.85); color: #dcebf7; border-radius: 999px;
            padding: 4px 10px; font-size: 11.5px; font-weight: 600; }
    .chip.solid { background: #173a5f; }
    .chip.gold { background: #f7ecd2; color: #0b2d4f; }
    .toggle { position: absolute; top: 348px; right: 12px; z-index: 6; display: flex;
              background: rgba(8,24,44,.92); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
    .toggle button { cursor: pointer; border: 0; background: transparent; color: #a9c2d8;
                     font: 600 12px Inter, system-ui, sans-serif; padding: 6px 13px; border-radius: 999px; }
    .toggle button.on { background: #d4a857; color: #0b2d4f; }
    .destcard { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5;
                background: rgba(8,24,44,.94); border: 1px solid rgba(255,255,255,.10);
                border-radius: 16px; padding: 13px 15px; }
    .destcard .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .bar { height: 5px; border-radius: 3px; background: #22364e; margin: 11px 0 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, #b8893a, #d4a857); border-radius: 3px; }
    .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: #c8d9e8; }
    .readout { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,.14);
               font-size: 11px; color: #7e97ad; }
    .puck { width: 22px; height: 22px; background: #f7e0a4; border: 4px solid #122c40; border-radius: 50%;
            box-shadow: 0 0 0 5px rgba(229,187,84,.25), 0 0 18px rgba(235,197,106,.55); }
    .destpin { width: 18px; height: 18px; background: #d4a857; border: 3px solid #f5ead2; border-radius: 50%;
               box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    .mile { background: #0d2748; border: 2px solid #d4a857; color: #f0d9a8; border-radius: 999px;
            padding: 2px 7px; font: 700 10.5px Inter, system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
    .stop { font: 500 11px Inter, system-ui, sans-serif; }
    .spill { display: flex; gap: 6px; align-items: baseline; white-space: nowrap;
             background: rgba(9,26,46,.94); border: 1px solid #cfb16c; color: #eef4fa;
             border-radius: 999px; padding: 4px 10px; box-shadow: 0 3px 10px rgba(0,0,0,.5); }
    .spill b { font-weight: 700; }
    .spill span { color: #d4a857; font-weight: 700; }
    .sdot { display: none; width: 11px; height: 11px; border-radius: 50%;
            background: #d4a857; border: 2px solid #0d2748; box-shadow: 0 1px 6px rgba(0,0,0,.5); }
    .view-overview .spill { display: none; }
    .view-overview .sdot { display: block; }
    .destline { margin-top: 9px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,.16);
                font-size: 12.5px; color: #f0d9a8; }
    .guideline { margin-top: 6px; font-size: 12px; line-height: 1.45; color: #a9c2d8; }
    .guideline:first-of-type { color: #dcebf7; }
    .reroute { margin-top: 9px; border-left: 3px solid #f59e0b; background: rgba(245,158,11,.10);
               padding: 7px 10px; border-radius: 0 8px 8px 0; font-size: 12.5px; color: #f5cf8f; }
    .spill.sub { border-color: #3ba08a; }
    .subtag { font-style: normal; font-size: 8.5px; font-weight: 800; letter-spacing: .08em;
              color: #0c2438; background: #3ba08a; border-radius: 4px; padding: 1.5px 4px; margin-right: 5px; }
    .stop.dotstop .sdot { display: block; }
    .altline { margin-top: 9px; font-size: 11.5px; line-height: 1.5; color: #a9c2d8; }
    .altline b { color: #f0d9a8; font-weight: 600; }
    .maplibregl-ctrl-attrib { font-size: 9px; }
    /* Minimizable panels: a slim summary bar stays, the rest folds away
       so the map can have the screen. The camera measures card heights,
       so it re-frames on its own when a panel folds. */
    .cardbtn { position: absolute; top: 8px; right: 8px; z-index: 2; width: 26px; height: 26px;
               border-radius: 50%; border: 1px solid rgba(255,255,255,.18); cursor: pointer;
               background: rgba(38,68,102,.85); color: #dcebf7; font-size: 13px; line-height: 1;
               display: flex; align-items: center; justify-content: center; }
    .minbar { display: none; font-size: 12.5px; font-weight: 600; color: #dcebf7; padding-right: 30px; }
    .banner.collapsed, .destcard.collapsed { padding-top: 10px; padding-bottom: 10px; }
    .collapsed .minbar { display: block; }
    .banner.collapsed > :not(.minbar):not(.cardbtn) { display: none; }
    .destcard.collapsed > :not(.minbar):not(.cardbtn):not(.bar) { display: none; }
    .destcard.collapsed .bar { margin: 8px 0 2px; }
    /* Real phones: the wide-layout cards wrapped until they ate the whole
       map. Compact the cards, give the frame the full screen height, and
       hard-cap card heights so a map band always survives. */
    @media (max-width: 430px) {
      main { padding: 10px; }
      header { margin-bottom: 8px; }
      header p { display: none; }
      h1 { font-size: 13px; }
      footer { display: none; }
      .frame { height: 94vh; height: 94dvh; min-height: 0; border-radius: 18px; }
      .banner { padding: 10px 12px; max-height: 47%; overflow-y: auto; }
      .kicker { font-size: 9.5px; letter-spacing: .2em; }
      .banner-title { font-size: 21px; }
      .banner-sub { font-size: 12px; }
      .queue { margin-top: 7px; }
      .chip { font-size: 11px; padding: 3px 8px; }
      .destline { margin-top: 7px; padding-top: 6px; font-size: 11.5px; }
      .guideline { font-size: 11.5px; line-height: 1.4; margin-top: 5px; }
      .reroute { font-size: 11.5px; padding: 6px 8px; margin-top: 7px; }
      .destcard { padding: 10px 12px; max-height: 42%; overflow-y: auto; }
      .meta { font-size: 12px; }
      .altline { font-size: 11px; line-height: 1.45; display: -webkit-box;
                 -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .readout { font-size: 10px; }
    }
  </style>
  <script type="module" crossorigin src="./assets/roadmap-proof-slice-aKS5x_8J.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/roadmap-proof-slice-B8-mEBLf.css">
</head>

</html>
